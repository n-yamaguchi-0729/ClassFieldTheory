name = "ClassFieldTheory"
version = "2.0.0"
defaultTargets = ["ClassFieldTheory", "ValuedFieldTheory.All", "GaloisCohomology.All"]
enableArtifactCache = false
restoreAllArtifacts = false

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "6f1ef4e5dd604a435bddba4747b13970cd65d2a1"

[[lean_lib]]
name = "ClassFieldTheory"
srcDir = "Lean4"
globs = ["ClassFieldTheory.*"]
leanOptions = {linter.missingDocs = true}

[[lean_lib]]
name = "ValuedFieldTheory.All"
srcDir = "Lean4"
globs = ["ValuedFieldTheory.+"]

[[lean_lib]]
name = "GaloisCohomology.All"
srcDir = "Lean4"
globs = ["GaloisCohomology.+"]
