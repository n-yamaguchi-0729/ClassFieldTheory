        Reuse the exact existing theorem, preserve its assumptions, separate
        Challenge and Solution, and do not invent missing provenance or test results.
  spend_usd: "not tracked"
  notes: >-
    The public library discloses development with AI assistance by a non-specialist.
    Human authorship and responsibility remain with Naganori Yamaguchi.
    Exact historical model names, usage shares, prompt histories and aggregate
    effort or costs are unknown; preparation of this interface does not
    reconstruct that history.
fidelity:
