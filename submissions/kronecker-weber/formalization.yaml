# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/v0.4.schema.json
version: "v0.4"
project:
  name: "The global Kronecker–Weber theorem in Lean"
  description: >-
    A formalization of the classical Kronecker–Weber theorem: every number field
    that is abelian Galois over the rational numbers admits a rational algebra
    embedding into a cyclotomic field of positive order. The proof is supplied
    by the class field theory development in this repository. This submission
    selects the global theorem and makes no claim of a new mathematical result.
  authors:
    - "Naganori Yamaguchi"
  responsible_maintainers:
    - "Naganori Yamaguchi"
  license: "Apache-2.0"
# The repository contains the substantive CFT development; no separate
# substantive repository or invented self-referential commit is declared.
classification:
  arxiv: ["math.NT"]
  msc2020: ["11R37"]
sources:
  - title: "Kronecker–Weber theorem (classical result)"
    type: "other"
    relationship: "formalizes"
    note: >-
      The source result is the classical theorem about finite abelian extensions
      of the rational numbers. Specific editions, theorem numbers, and literature
      actually consulted during proof development were not tracked. This entry
      does not attribute the proof to an unverified publication or assert an
      independent new proof. The responsible maintainer should complete the
      bibliographic account before submission.
related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4/tree/6f1ef4e5dd604a435bddba4747b13970cd65d2a1"
    relationship: "builds-on"
    note: >-
      Mathlib supplies the number-field, abelian-Galois, cyclotomic-field and
      algebra-homomorphism vocabulary, and reused mathematical infrastructure.
      No claim about the absence of other Kronecker–Weber formalizations is made.
status:
  scope: >-
    The selected declaration is KroneckerWeber.exists_cyclotomicEmbedding in
    ClassFieldTheory.KroneckerWeber.Core. Its carrier is L : Type with Field L,
    NumberField L and IsAbelianGalois Q L. It produces a positive natural n
    and Nonempty (L ->_a[Q] CyclotomicField n Q). Challenge contains the one
    deliberate statement hole; Solution imports the existing proof without
    changing its name, type or hypotheses. This nested submission package has
    not yet been built or checked by Comparator or the hosted verifier.
# Optional proof-status counts are omitted until this public candidate is
# audited; unknown counts must not be encoded as zero.
