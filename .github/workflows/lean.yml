name: Lean

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  library-procgroups:
    name: ProCGroups
    if: github.event.repository.private == false
    uses: ./.github/workflows/build-library.yml
    with:
      library: ProCGroups

  library-valuedfieldtheory:
    name: ValuedFieldTheory
    if: github.event.repository.private == false
    needs: library-procgroups
    uses: ./.github/workflows/build-library.yml
    with:
      library: ValuedFieldTheory

  library-galoiscohomology:
    name: GaloisCohomology
    if: github.event.repository.private == false
    needs: library-valuedfieldtheory
    uses: ./.github/workflows/build-library.yml
    with:
      library: GaloisCohomology

  library-schemetheory:
    name: SchemeTheory
    if: github.event.repository.private == false
    needs: library-galoiscohomology
    uses: ./.github/workflows/build-library.yml
    with:
      library: SchemeTheory

  library-classfieldtheory-algebra:
    name: ClassFieldTheory.Algebra
    if: github.event.repository.private == false
    needs: library-schemetheory
    uses: ./.github/workflows/build-library.yml
    with:
      library: ClassFieldTheory.Algebra

  library-classfieldtheory-abstractclassfieldtheory:
    name: ClassFieldTheory.AbstractClassFieldTheory
    if: github.event.repository.private == false
    needs: library-classfieldtheory-algebra
    uses: ./.github/workflows/build-library.yml
    with:
      library: ClassFieldTheory.AbstractClassFieldTheory

  library-classfieldtheory-localfieldtheory:
    name: ClassFieldTheory.LocalFieldTheory
    if: github.event.repository.private == false
    needs: library-classfieldtheory-abstractclassfieldtheory
    uses: ./.github/workflows/build-library.yml
    with:
      library: ClassFieldTheory.LocalFieldTheory

  library-classfieldtheory-ramificationtheory:
    name: ClassFieldTheory.RamificationTheory
    if: github.event.repository.private == false
    needs: library-classfieldtheory-localfieldtheory
    uses: ./.github/workflows/build-library.yml
    with:
      library: ClassFieldTheory.RamificationTheory

  library-classfieldtheory-lubintate:
    name: ClassFieldTheory.LubinTate
    if: github.event.repository.private == false
    needs: library-classfieldtheory-ramificationtheory
    uses: ./.github/workflows/build-library.yml
    with:
      library: ClassFieldTheory.LubinTate

  library-classfieldtheory-algebraicnumbertheory:
    name: ClassFieldTheory.AlgebraicNumberTheory
    if: github.event.repository.private == false
    needs: library-classfieldtheory-lubintate
    uses: ./.github/workflows/build-library.yml
    with:
      library: ClassFieldTheory.AlgebraicNumberTheory

  library-classfieldtheory-algebraicfunctionfieldtheory:
    name: ClassFieldTheory.AlgebraicFunctionFieldTheory
    if: github.event.repository.private == false
    needs: library-classfieldtheory-algebraicnumbertheory
    uses: ./.github/workflows/build-library.yml
    with:
      library: ClassFieldTheory.AlgebraicFunctionFieldTheory

  library-classfieldtheory-kummertheory:
    name: ClassFieldTheory.KummerTheory
    if: github.event.repository.private == false
    needs: library-classfieldtheory-algebraicfunctionfieldtheory
    uses: ./.github/workflows/build-library.yml
    with:
      library: ClassFieldTheory.KummerTheory

  library-classfieldtheory-localclassfieldtheory-classformation:
    name: ClassFieldTheory.LocalClassFieldTheory.ClassFormation
    if: github.event.repository.private == false
    needs: library-classfieldtheory-kummertheory
    uses: ./.github/workflows/build-library.yml
    with:
      library: ClassFieldTheory.LocalClassFieldTheory.ClassFormation

  library-classfieldtheory-localclassfieldtheory-lubintateapplication:
    name: ClassFieldTheory.LocalClassFieldTheory.LubinTateApplication
    if: github.event.repository.private == false
    needs: library-classfieldtheory-localclassfieldtheory-classformation
    uses: ./.github/workflows/build-library.yml
    with:
      library: ClassFieldTheory.LocalClassFieldTheory.LubinTateApplication

  library-classfieldtheory-localclassfieldtheory-finite:
    name: ClassFieldTheory.LocalClassFieldTheory.Finite
    if: github.event.repository.private == false
    needs: library-classfieldtheory-localclassfieldtheory-lubintateapplication
    uses: ./.github/workflows/build-library.yml
    with:
      library: ClassFieldTheory.LocalClassFieldTheory.Finite

  library-classfieldtheory-localclassfieldtheory:
    name: ClassFieldTheory.LocalClassFieldTheory
    if: github.event.repository.private == false
    needs: library-classfieldtheory-localclassfieldtheory-finite
    uses: ./.github/workflows/build-library.yml
    with:
      library: ClassFieldTheory.LocalClassFieldTheory

  library-classfieldtheory-globalclassfieldtheory:
    name: ClassFieldTheory.GlobalClassFieldTheory
    if: github.event.repository.private == false
    needs: library-classfieldtheory-localclassfieldtheory
    uses: ./.github/workflows/build-library.yml
    with:
      library: ClassFieldTheory.GlobalClassFieldTheory

  library-classfieldtheory-kroneckerweber:
    name: ClassFieldTheory.KroneckerWeber
    if: github.event.repository.private == false
    needs: library-classfieldtheory-globalclassfieldtheory
    uses: ./.github/workflows/build-library.yml
    with:
      library: ClassFieldTheory.KroneckerWeber

  library-classfieldtheory:
    name: ClassFieldTheory
    if: github.event.repository.private == false
    needs: library-classfieldtheory-kroneckerweber
    uses: ./.github/workflows/build-library.yml
    with:
      library: ClassFieldTheory

  library-algebraiccurves:
    name: AlgebraicCurves
    if: github.event.repository.private == false
    needs: library-classfieldtheory
    uses: ./.github/workflows/build-library.yml
    with:
      library: AlgebraicCurves

  library-etalefundamentalgroups:
    name: EtaleFundamentalGroups
    if: github.event.repository.private == false
    needs: library-algebraiccurves
    uses: ./.github/workflows/build-library.yml
    with:
      library: EtaleFundamentalGroups

  library-etalecohomology:
    name: EtaleCohomology
    if: github.event.repository.private == false
    needs: library-etalefundamentalgroups
    uses: ./.github/workflows/build-library.yml
    with:
      library: EtaleCohomology

  library-abelianvarieties:
    name: AbelianVarieties
    if: github.event.repository.private == false
    needs: library-etalecohomology
    uses: ./.github/workflows/build-library.yml
    with:
      library: AbelianVarieties

  library-entrypoint:
    name: EntryPoint
    if: github.event.repository.private == false
    needs: library-abelianvarieties
    uses: ./.github/workflows/build-library.yml
    with:
      library: EntryPoint

  verify:
    name: Gate NanoDa and complete declaration audit (no replay)
    if: github.event.repository.private == false
    needs: [library-procgroups, library-valuedfieldtheory, library-galoiscohomology, library-schemetheory, library-classfieldtheory-algebra, library-classfieldtheory-abstractclassfieldtheory, library-classfieldtheory-localfieldtheory, library-classfieldtheory-ramificationtheory, library-classfieldtheory-lubintate, library-classfieldtheory-algebraicnumbertheory, library-classfieldtheory-algebraicfunctionfieldtheory, library-classfieldtheory-kummertheory, library-classfieldtheory-localclassfieldtheory-classformation, library-classfieldtheory-localclassfieldtheory-lubintateapplication, library-classfieldtheory-localclassfieldtheory-finite, library-classfieldtheory-localclassfieldtheory, library-classfieldtheory-globalclassfieldtheory, library-classfieldtheory-kroneckerweber, library-classfieldtheory, library-algebraiccurves, library-etalefundamentalgroups, library-etalecohomology, library-abelianvarieties, library-entrypoint]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # diff-tree needs real parents, not a shallow boundary treated as a root.
          fetch-depth: 0
      - name: Test fail-closed verification gate
        run: python3 -B .github/verification/test_split_verification.py
      - name: Download proof phase evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verification-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/verification-proof
      - name: Require complete proof verification for this source snapshot
        run: |
          python3 -B .github/verification/combine_verification.py \
            --package-root "$GITHUB_WORKSPACE" \
            --proof "$RUNNER_TEMP/verification-proof/checks" \
            --proof-only
      - name: Check designated main declarations in the audited inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 -B .github/verification/check_main_declarations.py \
            --contract .github/verification/main-declarations.json \
            --verification "$RUNNER_TEMP/verification-proof/checks" \
            --output "$RUNNER_TEMP/verification-proof/main-declarations.json"
      - name: Check whitespace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = false
          git diff-tree --check --root -r HEAD
      - name: Preserve aggregate verification receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification-proof/
          if-no-files-found: error
          retention-days: 14

  publish-cache:
    name: Publish verified proof cache
    needs: verify
    if: github.event.repository.private == false && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ./.github/workflows/cache-release.yml
    with:
      cache-kind: legacy
