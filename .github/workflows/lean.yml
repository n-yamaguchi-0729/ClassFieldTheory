name: Lean

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Reject proof escapes and warning suppression
        shell: bash
        run: |
          if rg -n --glob '*.lean' '^\s*(set_option|sorry|admit|axiom)\b|\bnolint\b' Lean4/ClassFieldTheory; then
            echo "Prohibited Lean command found." >&2
            exit 1
          fi
          if rg -n --glob '*.lean' '^\s*(#check|#print|#lint|#synth|example)\b' Lean4/ClassFieldTheory; then
            echo "Production-only Lean command found." >&2
            exit 1
          fi
      - name: Check static public contracts
        run: python3 -B scripts/ClassFieldTheory/check_public_contracts.py
      - name: Build ClassFieldTheory with warnings as errors
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: "false"
          build: "true"
          build-args: "--wfail ClassFieldTheory"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
      - name: Check whitespace
        run: git diff-tree --check --root -r HEAD
